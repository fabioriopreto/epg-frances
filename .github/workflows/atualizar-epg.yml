name: Atualizar EPG francês

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *' # 07:17 UTC = 04:17 em Brasília
  push:
    branches: [main]
    paths:
      - 'mesclar_epg.py'
      - '.github/workflows/atualizar-epg.yml'

permissions:
  contents: read

concurrency:
  group: atualizar-epg-pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Combinar EPGs
        run: python mesclar_epg.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publicar:
    runs-on: ubuntu-latest
    needs: gerar
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
